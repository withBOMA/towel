<!-- Used for local development (supabase/config.toml).
     Paste the same body into Supabase Dashboard > Authentication > Emails
     for both "Magic link" and "Confirm signup" on staging and production. -->
<div style="font-family: system-ui, -apple-system, Segoe UI, Roboto, Arial, sans-serif; max-width: 480px; margin: 0 auto; padding: 24px; color: #0f172a;">
  <h2 style="margin: 0 0 12px;">Sign in</h2>
  <p style="margin: 0 0 20px;">Tap the button to sign in, or enter this code in the app:</p>
  <p style="font-size: 28px; font-weight: 700; letter-spacing: 6px; margin: 0 0 24px;">{{ .Token }}</p>
  <p style="margin: 0 0 24px;">
    <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=email&next={{ .RedirectTo }}"
       style="background: #1f5ad1; color: #ffffff; padding: 12px 20px; border-radius: 8px; text-decoration: none; font-weight: 600;">
      Sign in
    </a>
  </p>
  <p style="font-size: 13px; color: #64748b; margin: 0;">This link and code expire in 1 hour. If you didn't ask to sign in, ignore this email.</p>
</div>
